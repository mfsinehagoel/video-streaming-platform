<div class="auth-page">
  <div class="auth-card">
    <h1>Create Account</h1>

    <p class="subtitle">Join the video streaming platform</p>

    <form (ngSubmit)="register()">
      <div class="form-group">
        <label for="name">Name</label>

        <input
          id="name"
          type="text"
          name="name"
          [(ngModel)]="name"
          placeholder="Enter your name"
          required
        />
      </div>

      <div class="form-group">
        <label for="email">Email</label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Enter your email"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Create a password"
          required
        />
      </div>

      @if (errorMessage) {
        <div class="error">
          {{ errorMessage }}
        </div>
      }

      @if (successMessage) {
        <div class="success">
          {{ successMessage }}
        </div>
      }

      <button type="submit" [disabled]="loading">
        {{ loading ? 'Creating account...' : 'Register' }}
      </button>
    </form>

    <p class="login-link">
      Already have an account?

      <a routerLink="/login"> Login </a>
    </p>
  </div>
</div>
